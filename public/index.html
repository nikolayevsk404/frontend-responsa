<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Frontend Responsável</title>

    <!-- Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/browser-image-compression/2.0.2/browser-image-compression.js"></script>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(to bottom, #00a2ff 0%, #6beffe 100%);
        color: #fff;
        font-family: "Press Start 2P", cursive;
        height: 100vh;
        margin: 0;
        overflow-x: hidden;
        padding: 0;
        text-align: center;
      }

      h1 {
        color: #fff;
        padding-top: 40px;
        text-shadow: 2px 2px #000;
      }

      .container {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 20px;
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      button {
        background-color: #ffc800;
        border: 4px solid #000;
        box-shadow: 2px 2px 0 #fff;
        color: #000;
        cursor: pointer;
        font-family: "Press Start 2P", cursive;
        font-size: 14px;
        margin: 5px;
        padding: 10px 20px;
        transition: transform 0.1s, box-shadow 0.1s;
        width: 20rem;
      }

      button:active {
        box-shadow: none;
        transform: translate(2px, 2px);
      }

      button:hover {
        background-color: #ffc800;
      }

      canvas {
        background-color: #fff;
        border: 4px solid #ffc800;
        margin-top: 10px;
      }

      .ground {
        display: none;
      }

      input[type="file"] {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>Frontend Responsável</h1>

    <div class="container">
      <input type="file" id="imgInput" accept="image/*" />

      <button onclick="document.getElementById('imgInput').click()">
        Escolher Imagem
      </button>

      <canvas id="canvas" width="200" height="200"></canvas>

      <button onclick="cortarImagem()">Cortar Imagem</button>

      <button onclick="comprimirImagem()">Comprimir Imagem</button>

      <button onclick="baixarImagem()">Baixar Imagem</button>

      <input
        type="text"
        id="cpfInput"
        placeholder="Digite o CPF"
        maxlength="14"
        oninput="mascaraCPF(this)"
      />
      <button onclick="validarCPF()">Validar CPF</button>

      <div class="button-group">
        <button onclick="gerarPDF()">Gerar PDF</button>
        <button onclick="gerarExcel()">Gerar Excel</button>
      </div>
    </div>

    <div class="ground"></div>

    <script>
      let img;

      const imgInput = document.getElementById("imgInput");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      imgInput.addEventListener("change", (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          img = new Image();
          img.onload = () => desenharImagem();
          img.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      });

      function desenharImagem() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }

      function cortarImagem() {
        if (!img) return alert("Selecione uma imagem primeiro!");

        const originalWidth = img.naturalWidth;
        const originalHeight = img.naturalHeight;

        const cropSize = Math.min(originalWidth, originalHeight);
        const centerX = (originalWidth - cropSize) / 2;
        const centerY = (originalHeight - cropSize) / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(
          img,
          centerX,
          centerY,
          cropSize,
          cropSize,
          0,
          0,
          canvas.width,
          canvas.height
        );

        alert(
          `Imagem original: ${originalWidth}x${originalHeight}px\n` +
            `Imagem cortada (canvas): ${canvas.width}x${canvas.height}px`
        );
      }

      function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Opa! Opa! Tudo belezura?", 10, 10);
        doc.save("demo.pdf");
      }

      function gerarExcel() {
        const data = [
          { Nome: "Guilherme", Idade: 26 },
          { Nome: "Haruna", Idade: 25 },
        ];
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Galera");
        XLSX.writeFile(wb, "galera.xlsx");
      }

      function mascaraCPF(campo) {
        let cpf = campo.value.replace(/\D/g, "");
        cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
        cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
        cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        campo.value = cpf;
      }

      function validarCPF() {
        const cpfInput = document.getElementById("cpfInput");
        let cpf = cpfInput.value.replace(/\D/g, "");

        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) {
          return alert("CPF inválido");
        }

        let soma = 0;
        for (let i = 0; i < 9; i++) {
          soma += parseInt(cpf.charAt(i)) * (10 - i);
        }
        let resto = (soma * 10) % 11;
        if (resto == 10 || resto == 11) resto = 0;
        if (resto != parseInt(cpf.charAt(9))) return alert("CPF inválido");

        soma = 0;
        for (let i = 0; i < 10; i++) {
          soma += parseInt(cpf.charAt(i)) * (11 - i);
        }
        resto = (soma * 10) % 11;
        if (resto == 10 || resto == 11) resto = 0;
        if (resto != parseInt(cpf.charAt(10))) return alert("CPF inválido");

        alert("CPF válido!");
      }

      async function comprimirImagem() {
        if (!imgInput.files.length)
          return alert("Selecione uma imagem primeiro!");

        const file = imgInput.files[0];
        const options = {
          maxSizeMB: 0.1,
          maxWidthOrHeight: 800,
          useWebWorker: true,
        };

        try {
          const compressedFile = await imageCompression(file, options);
          alert(
            `Imagem comprimida de ${(file.size / 1024).toFixed(2)}KB para ${(
              compressedFile.size / 1024
            ).toFixed(2)}KB`
          );
        } catch (error) {
          console.error(error);
        }
      }

      function baixarImagem() {
        const link = document.createElement("a");
        link.download = "imagem.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }
    </script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
